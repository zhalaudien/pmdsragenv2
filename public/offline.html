<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anda Sedang Offline | Pemuda MTA Perwakilan Sragen</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="/icons/pemudamta.png" type="image/png">
    <link rel="icon" type="image/png" href="/icons/pemudamta.png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            margin: 0;
        }
        .offline-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            max-width: 440px;
            width: 100%;
            padding: 2.5rem 2rem;
            text-align: center;
            border: 1px solid #e2e8f0;
        }
        .offline-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #fef2f2;
            color: #dc2626;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
        }
        .btn-retry {
            background: linear-gradient(135deg, #991b1b 0%, #dc2626 100%);
            color: #ffffff;
            border: none;
            padding: 0.75rem 1.75rem;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.2s;
            width: 100%;
        }
        .btn-retry:hover {
            background: #7f1d1d;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="mb-3 text-center">
            <img src="/icons/pemudamta.png" alt="Logo Pemuda MTA" style="width: 54px; height: 60px; object-fit: contain;">
        </div>
        <div class="offline-icon">
            <i class="bi bi-wifi-off"></i>
        </div>
        <h4 class="fw-bold text-dark mb-2">Koneksi Internet Terputus</h4>
        <p class="text-muted small mb-4">
            Perangkat Anda sedang tidak terhubung ke jaringan internet. Silakan periksa koneksi Wi-Fi atau paket data seluler Anda, lalu muat ulang halaman.
        </p>
        <button onclick="window.location.reload();" class="btn btn-retry shadow-sm">
            <i class="bi bi-arrow-clockwise me-2"></i> Muat Ulang Halaman
        </button>
        <div class="mt-4 pt-3 border-top text-muted small">
            Pemuda MTA Perwakilan Sragen
        </div>
    </div>
</body>
</html>
